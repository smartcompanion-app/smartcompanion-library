name: pages

# The site tracks main rather than releases: a docs fix or a component change is
# visible as soon as it merges, without waiting for a publish.
#
# One Pages site per repository, so the documentation is the site and Storybook
# is copied into it under /storybook/. The custom domain comes from
# packages/docs/static/CNAME, which Docusaurus copies into the build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: 22

jobs:
  deploy:
    name: Deploy docs and Storybook
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook -w packages/ui

      - name: Build the documentation site
        run: npm run docs:build

      # Storybook's build references its assets relatively, so it works from a
      # subdirectory as is.
      - name: Add Storybook to the site
        run: cp -r packages/ui/storybook-static packages/docs/build/storybook

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
